name: test
on: [push, pull_request]

jobs:
  core:
    # The shared code, the Windows parts (with fakes) and the Qt window, headless.
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    env:
      QT_QPA_PLATFORM: offscreen
      HF_HUB_OFFLINE: "1"
      TRANSFORMERS_OFFLINE: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - name: Qt's system libraries
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libegl1 libxkbcommon0 libfontconfig1 libdbus-1-3
      - run: uv sync --frozen
      - run: uv run python -m unittest discover -s tests -p "test_[!g]*.py" -v

  gtk:
    # The GNOME window, on the distro's GTK and PyGObject, as Linux users run it.
    # Ubuntu 26.04 to match development; 24.04's older GTK fails three tests on main too.
    runs-on: ubuntu-latest
    container: ubuntu:26.04
    steps:
      - uses: actions/checkout@v4
      - run: |
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y python3-gi gir1.2-gtk-4.0 gir1.2-adw-1 gir1.2-gtksource-5 gir1.2-secret-1 xvfb xauth dbus
      - run: >
          xvfb-run -a dbus-run-session -- python3
          -W ignore::DeprecationWarning:gi.events -W ignore::DeprecationWarning:gi.overrides
          -m unittest discover -s tests -p test_gui.py -v
