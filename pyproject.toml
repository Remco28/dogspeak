[project]
name = "dogspeak"
version = "0.2.0"
description = "Local dictation scratchpad for Linux/GNOME that turns rambling speech into clear prompts"
license = "MIT"
requires-python = ">=3.12,<3.13"
dependencies = [
  "torch>=2.8",
  "transformers>=5.19,<6",
  "constriction>=0.4",
  "numpy>=2",
  "soundfile>=0.13",
  "soxr>=0.5",
  "psutil>=7",
  "librosa>=0.11",
  "anthropic>=1,<2",
]

[tool.uv]
package = false

[tool.uv.sources]
torch = { index = "pytorch-cpu" }

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true
