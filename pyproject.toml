[project]
name = "dogspeak"
version = "0.4.0"
description = "Local dictation scratchpad for Linux (GNOME) and Windows that turns rambling speech into clear prompts"
license = "MIT"
requires-python = ">=3.12,<3.13"
dependencies = [
  "torch>=2.8",
  "transformers>=5.19,<6",
  "constriction>=0.4",
  "numpy>=2",
  "soundfile>=0.13",
  "soxr>=0.5",
  "psutil>=7",
  "librosa>=0.11",
  "anthropic>=1,<2",
  # Windows runs the whole app in this environment: a Qt window, microphone
  # capture through PortAudio, and API keys in Windows Credential Manager.
  "PySide6-Essentials>=6.8; sys_platform == 'win32'",
  "sounddevice>=0.5; sys_platform == 'win32'",
  "keyring>=25; sys_platform == 'win32'",
]

[dependency-groups]
# The Qt window's tests also run on Linux, headless.
dev = ["PySide6-Essentials>=6.8"]

[tool.uv]
package = false

[tool.uv.sources]
torch = { index = "pytorch-cpu" }

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true
